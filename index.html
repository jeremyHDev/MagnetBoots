<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Flip gravity and fight your way through the Trophy Hall and Cargo Lift in a 2D action platformer.">
<title>Magnet Boots</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#100f14;color:#f6e8ce;font:16px system-ui,sans-serif}main{width:min(1200px,96vw);padding:22px 0}header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header{margin-bottom:14px}h1{margin:0;font-size:clamp(26px,5vw,50px);font-weight:950;letter-spacing:-.055em;line-height:1;text-transform:uppercase}header span{color:#ffc474;font-weight:750;letter-spacing:.15em;text-transform:uppercase;font-size:14px}.screen{position:relative;border:1px solid #665042;box-shadow:0 12px 50px #0008;background:#201722}canvas{display:block;width:100%;height:auto}footer{margin-top:15px;justify-content:flex-start}button{color:inherit;background:#261f28;border:1px solid #615044;border-radius:5px;padding:8px 12px;font:inherit;cursor:pointer;touch-action:none;user-select:none}button:hover,button:focus-visible{border-color:#ffd080}kbd{color:#ffd080;margin-right:5px}#status{margin-left:auto;color:#a0e9ee;font-weight:700}#announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
<script defer src="game.js"></script>
</head>
<body>
<main>
<header><h1>Magnet Boots</h1><span id="room-name">The Trophy Hall</span></header>
<div class="screen"><canvas id="game" width="1080" height="540" aria-label="Trophy Hall platform game"></canvas><span id="announcement" aria-live="polite"></span></div>
<footer aria-label="Game controls">
<button data-key="ArrowLeft"><kbd>←</kbd> Left</button>
<button data-key="ArrowRight"><kbd>→</kbd> Right</button>
<button data-key="Space"><kbd>Space</kbd> Jump</button>
<button data-key="KeyE"><kbd>E</kbd> Flip</button>
<button data-key="KeyJ"><kbd>J</kbd> Blaster</button>
<button data-key="KeyK"><kbd>K</kbd> Sword</button>
<button data-key="KeyR"><kbd>R</kbd> Restart</button>
<span id="status">Defeat the guard to open the exit</span>
</footer>
</main>
</body>
</html>
